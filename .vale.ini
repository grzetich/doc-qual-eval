# Vale configuration.
#
# Deliberately narrow. Every rule enabled here either supplies its own
# replacement text, which makes it patchable, or flags something a human can
# judge on sight. Rules that produce opinions without a fix are noise in a
# proposal queue, and noise is what trains maintainers to ignore this kind of
# tool.

StylesPath = styles
MinAlertLevel = warning

Packages = Google

[*.{md,mdx}]
BasedOnStyles = Vale, Google

# Off by choice: these fire constantly on technical prose and none of them
# supply a replacement, so they can only ever land in the review pile.
Google.Passive = NO
Google.WordList = NO
Google.Headings = NO
Vale.Spelling = NO
